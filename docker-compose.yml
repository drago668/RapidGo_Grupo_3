services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: pipeline-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    networks:
      - pipeline-net

  spark-master:
    image: spark:4.2.0-python3
    hostname: spark-master
    container_name: pipeline-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./data:/datalake
    networks:
      - pipeline-net
    depends_on:
      - kafka

  spark-worker-1:
    image: spark:4.2.0-python3
    hostname: spark-worker-1
    container_name: pipeline-spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "1", "--memory", "768m", "--webui-port", "8081"]
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./data:/datalake 
    networks:
      - pipeline-net
    depends_on:
      - spark-master

  postgres-airflow:
    image: postgres:13
    container_name: pipeline-postgres-airflow
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    networks:
      - pipeline-net

  airflow-webserver:
    image: apache/airflow:2.7.2
    container_name: pipeline-airflow-webserver
    depends_on:
      - postgres-airflow
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/datalake
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    command: webserver
    networks:
      - pipeline-net

  airflow-scheduler:
    image: apache/airflow:2.7.2
    container_name: pipeline-airflow-scheduler
    depends_on:
      - postgres-airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/datalake
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    command: scheduler
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge